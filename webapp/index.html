<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Colombia - Departamentos y Municipios</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Estilos personalizados -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Estilos para el buscador flotante en la esquina superior derecha */
        .search-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 6px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        #search-input {
            padding: 5px;
            width: 160px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        #search-btn {
            padding: 5px 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #search-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <!-- Contenedor del buscador -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Buscar departamento...">
        <button id="search-btn">Buscar</button>
    </div>

    <!-- Contenedor principal del mapa -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Script de nuestra aplicación -->
    <script src="js/app.js"></script>
</body>
</html>
